      closeSheet();
      const st=$("#status");
      if(st){ st.style.display="block"; st.textContent="PIN changed. Your data and "+(j.snapshotsMoved||0)+" restore points moved with it."; setTimeout(()=>{st.style.display="none";},6000); }
      loadRemote().then(render);
    }catch(err){ b.disabled=false; b.textContent="Change my PIN"; showErr("#pErr",err.message); }
  });
}
function cfgSheet(){
  if(isGuest()){
    openSheet("Account",
      '<p class="hint" style="margin-top:4px">Signed in as <b style="color:var(--ink)">'+esc(AUTH.u)+'</b> with an advisor PIN. This view is read-only and never includes ESOPs.</p>'+
      '<button class="primary" id="sOut">Sign out</button>'+
      '<p class="hint" style="margin-top:16px;text-align:center">Build <span class="mono">'+BUILD+'</span></p>');
    $("#sOut").addEventListener("click",signOut);
    return;
  }
  openSheet("Account",
    '<p class="hint" style="margin-top:4px">Signed in as <b style="color:var(--ink)">'+esc(AUTH.u)+'</b>. Everything you change is saved automatically.</p>'+
    '<button class="primary" id="sOut">Sign out</button>'+
    '<div class="secthead">Security</div>'+
    '<button class="ghost" id="sPin">Change my PIN</button>'+
    '<p class="hint" style="margin-top:6px">Moves your data and every restore point to the new PIN automatically.</p>'+
    '<div class="secthead">If something goes wrong</div>'+
    '<button class="ghost" id="sHist">Go back to an earlier version</button>'+
    '<p class="hint" style="margin-top:6px">Every day’s version is kept, plus one for every month — forever.</p>'+
    '<button class="ghost" id="sExp">Save a copy to this device</button>'+
    '<p class="hint" style="margin-top:6px">Everything in one file — shares, transactions, funds, ESOPs and imported history. Keep it anywhere as your own backup.</p>'+
    '<div class="secthead">Advisor access</div>'+
    '<div class="f"><label>Advisor PIN — view-only, ESOPs stay hidden</label><input id="gPin" class="mono" inputmode="numeric" autocomplete="off" placeholder="4+ digits, not your own PIN"></div>'+
    '<div class="acts"><button id="gSet">Set / change</button><button id="gOff">Revoke access</button></div>'+
    '<div class="err" id="gErr"></div>'+
    '<p class="hint" id="gMsg" style="margin-top:6px">Share the app link, your username and that PIN. Your advisor sees stocks and funds only, and cannot change or save anything. Setting a new PIN here replaces the old one immediately — which is how you hand over to a different advisor — and Revoke ends all advisor access.</p>'+
    '<div class="secthead">Danger</div>'+
    '<button class="ghost" id="sDel" style="color:var(--loss);border-color:var(--loss)">Delete my account and data</button>'+
    '<div class="err" id="sErr"></div>'+
    '<p class="hint" style="margin-top:16px;text-align:center">Build <span class="mono">'+BUILD+'</span></p>');
  $("#sOut").addEventListener("click",signOut);
  $("#sPin").addEventListener("click",pinSheet);
  const gCall=async gp=>{
    const r=await fetch(api(""),{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({action:"setguest",gp:gp})});
    return r.json();
  };
  $("#gSet").addEventListener("click",async e=>{
    const b=e.currentTarget, gp=$("#gPin").value.trim();
    if(gp.length<4) return showErr("#gErr","The advisor PIN needs at least 4 digits.");
    if(gp===String(AUTH.p)) return showErr("#gErr","Pick something different from your own PIN.");
    b.disabled=true;
    try{ const j=await gCall(gp);
      if(j.error) throw new Error(j.error==="same_as_owner"?"Pick something different from your own PIN.":"Couldn\u2019t save \u2014 "+j.error);
      $("#gPin").value=""; $("#gMsg").textContent="Advisor PIN is set. Share the app link, your username \u2018"+AUTH.u+"\u2019 and that PIN.";
    }catch(err){ showErr("#gErr",err.message); }
    b.disabled=false;
  });
  $("#gOff").addEventListener("click",async e=>{
    const b=e.currentTarget; b.disabled=true;
    try{ const j=await gCall("");
      if(j.error) throw new Error(j.error);
      $("#gMsg").textContent="Advisor access is off. Anyone with the old advisor PIN is locked out.";
    }catch(err){ showErr("#gErr",err.message); }
    b.disabled=false;
  });
  $("#sHist").addEventListener("click",restoreSheet);
  $("#sDel").addEventListener("click",async e=>{
    const b=e.currentTarget;
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Really delete everything?"; return; }
    try{
      const r=await fetch(api(""),{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"unregister"})});
      const j=await r.json();
      if(j.error) return showErr("#sErr",errMsg(j.error));
      try{localStorage.removeItem("nivesh_cache_"+AUTH.u);}catch(e2){}
      signOut();
    }catch(e2){ showErr("#sErr","Could not reach the server."); }
  });
  $("#sExp").addEventListener("click",e=>{
    exportBackup(); nudgeDone();
    e.currentTarget.textContent="Saved to your downloads";
    setTimeout(()=>{const b=$("#sExp"); if(b) b.textContent="Save a copy to this device";},2500);
  });
}

/* tabs */
function setTab(t){ tab=(isGuest()&&t==="esop")?"home":t;
  if(STOCK_TABS.includes(tab)) lastStockTab=tab;
  render(); }

/* ---------- boot ---------- */
function mountShell(){
  $("#app").innerHTML=shellHTML();
  applyTheme();
  $("#themeBtn").addEventListener("click",cycleTheme);
  $("#eyeBtn").addEventListener("click",eyeTap);
  setMask(maskOn());
  $("#cfgBtn").addEventListener("click",cfgSheet);
  $("#searchBtn").addEventListener("click",searchSheet);
  const fb=$("#fab");
  if(fb) fb.addEventListener("click",()=>{
    if(guestGuard()) return;
    if(tab==="esop") esopGrantSheet();
    else if(tab==="mf") mfSheet();
    else if(tab==="home") addWhatSheet();
    else addSheet();
  });
  $("#seg").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    setTab(b.dataset.tab==="stocks"?lastStockTab:b.dataset.tab);
  });
}
function mountSetup(mode){
  mode=mode||"in";
  $("#app").innerHTML=setupHTML(mode);
  applyTheme();
  $("#authT").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.v!==mode)mountSetup(b.dataset.v);});
  $("#cGo").addEventListener("click",async()=>{
    const u=$("#cUser").value.trim().toLowerCase(), pin=$("#cPin").value;
    if(!u||!pin) return showErr("#cErr","Both fields are required.");
    if(mode==="new"&&pin!==$("#cPin2").value) return showErr("#cErr","PINs don't match.");
    $("#cGo").disabled=true;
    try{
      if(mode==="new"){
        const rr=await fetch(BACKEND+"?u="+encodeURIComponent(u)+"&p="+encodeURIComponent(pin),
          {method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"register"})});
        const jj=await rr.json();
        if(jj.error) throw new Error(errMsg(jj.error));
      }
      const r=await fetch(BACKEND+"?u="+encodeURIComponent(u)+"&p="+encodeURIComponent(pin)+"&action=load");
      const j=await r.json();
      if(j.error) throw new Error(errMsg(j.error));
      AUTH={u,p:pin}; if(j.guest) AUTH.g=1;
      try{localStorage.setItem("nivesh_auth",JSON.stringify(AUTH));}catch(e){}
      if(j.data){ stocks=j.data.stocks||{}; txns=j.data.txns||{};
        if(j.data.history) meta.history=j.data.history;
        if(j.data.esops) meta.esops=j.data.esops;
        if(j.data.mf) meta.mf=j.data.mf; } else { stocks={}; txns={}; }
      ready=true; live=true; cacheLocal();
      mountShell(); render(); pollQuotes();
    }catch(e){ $("#cGo").disabled=false; showErr("#cErr",e.message); }
  });
}
(async function boot(){
  if("serviceWorker" in navigator){ try{navigator.serviceWorker.register("sw.js");}catch(e){} }
  if(!AUTH){ mountSetup("in"); return; }
  try{ const c=JSON.parse(localStorage.getItem("nivesh_cache_"+AUTH.u)||"null");
    if(c){ stocks=c.stocks||{}; txns=c.txns||{}; meta=c.meta||{}; idx=c.idx||{}; ready=true; } }catch(e){}
  mountShell(); render();
  /* both relay calls go out at once - the second used to wait on the first,
     which doubled the cold-start wait before correct prices appeared */
  const dataP=loadRemote(), quoteP=pollQuotes();
  dataP.then(()=>mfSyncNav());
  await dataP;
  if(lastQuotes) applyQuotes(lastQuotes);   /* fresh server data must not clobber newer prices */
  render();
  await quoteP;
  if(lastQuotes) applyQuotes(lastQuotes);
  render();
})();
</script>
