<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folio</title>
<meta name="theme-color" content="#0D0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Folio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --surface2:#FBFAF7;
  --ink:#1C1B18; --muted:#75726A; --faint:#A6A29A;
  --line:#E7E4DC; --line2:#EFEDE6;
  --gold:#8A6D3B; --gold-soft:rgba(138,109,59,.10);
  --btn:#1C1B18; --btn-ink:#F7F6F2;
  --gain:#177E52; --loss:#C4423D;
  --gain-bg:rgba(23,126,82,.08); --loss-bg:rgba(196,66,61,.08);
  --sheet-shadow:0 -16px 48px rgba(28,27,24,.16);
  --card-shadow:0 1px 3px rgba(28,27,24,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0F; --surface:#16161A; --surface2:#1C1C21;
    --ink:#ECEAE4; --muted:#928F86; --faint:#5F5D57;
    --line:#26262B; --line2:#202024;
    --gold:#D4B274; --gold-soft:rgba(212,178,116,.12);
    --btn:#ECEAE4; --btn-ink:#141416;
    --gain:#46C08A; --loss:#E77B72;
    --gain-bg:rgba(70,192,138,.10); --loss-bg:rgba(231,123,114,.10);
    --sheet-shadow:0 -16px 48px rgba(0,0,0,.6);
    --card-shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0F; --surface:#16161A; --surface2:#1C1C21;
  --ink:#ECEAE4; --muted:#928F86; --faint:#5F5D57;
  --line:#26262B; --line2:#202024;
  --gold:#D4B274; --gold-soft:rgba(212,178,116,.12);
  --btn:#ECEAE4; --btn-ink:#141416;
  --gain:#46C08A; --loss:#E77B72;
  --gain-bg:rgba(70,192,138,.10); --loss-bg:rgba(231,123,114,.10);
  --sheet-shadow:0 -16px 48px rgba(0,0,0,.6);
  --card-shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:"Schibsted Grotesk",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"Spline Sans Mono",ui-monospace,SFMono-Regular,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 18px calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
input,select,textarea{font:inherit;color:var(--ink)}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

header{display:flex;align-items:center;justify-content:space-between;padding:calc(22px + env(safe-area-inset-top)) 0 2px}
.wordmark{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:25px;letter-spacing:.01em}
.wordmark span{color:var(--gold);font-style:normal}
.hr{display:flex;align-items:center;gap:10px}
.hbtn{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);padding:8px 2px;border-bottom:1px solid var(--gold)}
.tbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:14px;line-height:1;color:var(--muted)}

.idx{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 0 0}
.idxc{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:10px 13px;box-shadow:var(--card-shadow)}
.idxn{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.idxv{font-size:16px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.idxd{font-size:11.5px;font-weight:600;margin-top:1px;min-height:14px}
.hero{padding:16px 0 4px}
.hcard{background:linear-gradient(140deg,#191817 0%,#23201B 55%,#2C261C 100%);border:1px solid rgba(212,178,116,.28);border-radius:20px;padding:20px 20px 16px;color:#ECEAE4;box-shadow:0 12px 32px rgba(20,18,14,.28)}
.hgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px 12px}
.hk{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:rgba(236,234,228,.45);font-weight:600;margin-bottom:4px}
.hv{font-size:19.5px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.hv small{font-size:12px;font-weight:500;opacity:.9}
.hgrid .r{text-align:right}
.hcard .gain{color:#57D9A3}.hcard .loss{color:#F49790}
.gl{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;font-size:12.5px;color:rgba(236,234,228,.75)}
.gl b{font-weight:700;color:#ECEAE4;font-size:14px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.05em;color:rgba(236,234,228,.5)}
.live i{width:6px;height:6px;border-radius:50%;background:#57D9A3;display:inline-block}
.live.off i{background:rgba(236,234,228,.35)}
.live.wait i{background:#D4B274;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.live.wait i{animation:none}}
.glbar{margin-top:9px;height:5px;border-radius:3px;overflow:hidden;display:flex;background:rgba(255,255,255,.12)}
.glbar i{height:100%}
.glbar .g{background:#57D9A3;border-radius:3px 0 0 3px} .glbar .l{background:#F49790;flex:1;border-radius:0 3px 3px 0}
.cagr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(212,178,116,.22)}
.cagr .gain{color:#57D9A3}.cagr .loss{color:#F49790}

.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;position:sticky;top:10px;z-index:5;box-shadow:var(--card-shadow);margin-top:18px}
.seg button{padding:9px 0;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}

.list{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--card-shadow);overflow:hidden}
.chead{display:flex;align-items:baseline;gap:8px;padding:15px 18px 0}
.chead .t{font-weight:600;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .sym{font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.chead .sp{flex:1}
.dpill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px}
.dpill.g{background:var(--gain-bg);color:var(--gain)}
.dpill.l{background:var(--loss-bg);color:var(--loss)}
.g9{display:grid;grid-template-columns:1.05fr 1fr 1.15fr;gap:12px 12px;padding:13px 18px 15px}
.kv .k{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.kv .v{font-size:13.5px}
.kv .v small{font-size:11px;color:var(--muted)}
.g9 .r{text-align:right}
.acts{display:flex;border-top:1px solid var(--line2)}
.acts button{flex:1;padding:11px 0;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line2)}
.acts button:first-child{border-left:0}
.acts .buy{color:var(--gold)} .acts .sell{color:var(--loss)}
.acts .danger[data-armed="1"]{color:var(--loss)}

.chips{display:flex;gap:6px;margin-top:16px}
.chips button{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.flows{margin-top:12px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--card-shadow);overflow:hidden}
.mwrap{display:flex;align-items:center;border-top:1px solid var(--line2)}
.mwrap:first-child{border-top:0}
.mwrap.on{background:var(--gold-soft)}
.msel{flex:none;width:21px;height:21px;margin:0 0 0 18px;border-radius:6px;border:1.5px solid var(--line);
  background:var(--surface2);color:var(--gold);font-size:12px;font-weight:700;line-height:1;padding:0}
.msel[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.frow{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 18px 13px 12px}
.ecard{margin-top:16px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;
  box-shadow:var(--card-shadow);padding:4px 18px 16px}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.est{display:block;width:100%;text-align:left;padding:14px 0 0;border-top:1px solid var(--line2);background:none}
.est:active{opacity:.6}
.egrid .est:nth-child(1),.egrid .est:nth-child(2){border-top:0}
.est span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.est b{display:block;margin-top:5px;font-size:19px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.est i{display:block;margin-top:3px;font-size:10.5px;font-style:normal;color:var(--muted)}
.ertop{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.el{flex:1;min-width:0}
.el b{display:block;font-size:13.5px;font-weight:600}
.el span{display:block;margin-top:2px;font-size:11px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er2{flex:none;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600}
.er2 i{width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);
  color:var(--muted);font-style:normal;font-size:12px;line-height:18px;text-align:center;flex:none}
.elist{margin-top:10px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;
  box-shadow:var(--card-shadow);overflow:hidden}
.eform{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-bottom:12px}
.ei span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:4px}
.ei input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);text-align:right}
.eres{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;font-size:12px;color:var(--muted)}
.eres b{font-size:12.5px;font-weight:500;color:var(--ink)}
.eres.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:11px}
.eres.tot span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.eres.tot b{font-size:17px;font-weight:600}
.etbl{margin-top:10px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;
  box-shadow:var(--card-shadow);overflow:hidden}
.eo{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;table-layout:fixed}
.eo th:first-child{width:38%}
.eo th:nth-child(2){width:22%}
.eo thead th{background:var(--surface);border-bottom:1px solid var(--line2);
  font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  padding:11px 12px;text-align:right}
.eo thead th:first-child{text-align:left}
.eo tbody th{text-align:left;font-size:13.5px;font-weight:600;padding:12px 12px}
.eo tbody th span{display:block;margin-top:2px;font-size:10px;font-weight:500;color:var(--muted)}
.eo tbody td{text-align:right;padding:12px 12px;vertical-align:middle;white-space:nowrap}
.eo tr.on th,.eo tr.on td{background:var(--gold-soft)}
.eo tbody tr:not(.on)+tr:not(.on) th,.eo tbody tr:not(.on)+tr:not(.on) td{border-top:1px solid var(--line2)}
.qbtn{font:inherit;font-family:"Spline Sans Mono",monospace;font-size:13.5px;font-weight:600;color:var(--gold);
  border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:5px 11px}
.ebox{padding:2px 14px 16px !important;background:var(--gold-soft);text-align:left !important}
.gvr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:13px}
.gvr:first-of-type{border-top:0}
.gvr span:first-child{color:var(--muted)}
.cus{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.cusr{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center}
.cusr span{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.cus select{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;
  padding:8px 9px;font:inherit;font-size:13px;color:var(--ink)}
.ftot{margin-top:12px;padding:12px 16px;border:1px solid var(--gold);border-radius:14px;background:var(--gold-soft)}
.ftot .ft1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.ftot .ft1 b{font-size:19px;font-weight:600;color:var(--ink)}
.ftot .ft2{display:flex;align-items:baseline;gap:6px;margin-top:5px;font-size:11.5px;color:var(--muted)}
.ftot .ft2 .linky{margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.frow .m{width:84px;font-size:13px;font-weight:600}
.frow .bar{flex:1;height:4px;border-radius:2px;background:var(--line2);overflow:hidden;position:relative}
.frow .bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.frow .bar i.in{background:var(--gold)}
.frow .bar i.ret{background:var(--gain)}
.frow .a{width:104px;text-align:right;font-size:13px;font-weight:500}
.mdet{border-top:1px solid var(--line2);background:var(--surface2);padding:2px 18px 8px}
.fr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.fr:first-child{border-top:0}
.fl{flex:1;min-width:0}
.fn{font-size:13px;font-weight:600;display:flex;align-items:baseline;gap:6px;min-width:0}
.fn .nw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn .tag{flex:none}
.fs{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa{font-size:13.5px;font-weight:500;white-space:nowrap;text-align:right}
.tag{font-size:9px;font-weight:700;letter-spacing:.07em;padding:2px 5px;border-radius:4px}
.tag.b{background:var(--gold-soft);color:var(--gold)}
.tag.s{background:var(--gain-bg);color:var(--gain)}
.apx{color:var(--faint);font-weight:400}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2)}
.trow:first-child{border-top:0}
.trow .d8{font-size:11px;color:var(--muted);width:78px}
.trow .nm{flex:1;font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .side{font-size:9.5px;font-weight:700;letter-spacing:.08em;width:36px}
.trow .q{font-size:12px;text-align:right;color:var(--muted)}
.trow .amt{font-size:12.5px;text-align:right;width:92px}
.trow .del{color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px}

.plan{margin-top:16px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--card-shadow);padding:18px}
.plan h3{margin:0 0 3px;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:19px}
.plan .sub{font-size:12px;color:var(--muted)}
.cashrow{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:14px;align-items:center}
.togg{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.togg button{padding:7px 13px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.togg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.togg.sell button[aria-pressed="true"]{background:var(--loss);color:#fff}
.cashrow input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-family:"Spline Sans Mono",monospace;font-size:14px;text-align:right}
.prl{display:grid;grid-template-columns:1fr 64px 58px 1fr;gap:8px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.prl .n{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prl .now{font-size:12px;color:var(--muted);text-align:right}
.prl input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 6px;font-family:"Spline Sans Mono",monospace;font-size:13px;text-align:right}
.prl .act{font-size:12px;text-align:right}
.plhead{display:grid;grid-template-columns:1fr 64px 58px 1fr;gap:8px;padding:16px 0 6px}
.plhead span{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:right}
.plhead span:first-child{text-align:left}
.plfoot{border-top:1px solid var(--line);margin-top:2px;padding-top:13px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.plfoot b{font-weight:600;color:var(--ink)}

/* plan table */
.ptwrap{margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);
  border:1px solid var(--line2);border-radius:14px;box-shadow:var(--card-shadow)}
.pt{border-collapse:separate;border-spacing:0;width:100%;min-width:452px;font-size:11.5px}
.pt thead th{position:sticky;top:0;background:var(--surface);z-index:2;
  font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  text-align:right;padding:9px 6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.pt thead th:first-child{text-align:left;padding-left:12px;left:0;z-index:3}
.pt tbody th{position:sticky;left:0;background:var(--surface);z-index:1;
  text-align:left;font-weight:600;font-size:11.5px;padding:8px 8px 8px 12px;
  max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-bottom:1px solid var(--line2)}
.pt tbody td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line2);vertical-align:middle}
.pt tbody tr:last-child th,.pt tbody tr:last-child td{border-bottom:0}
.pt input{width:52px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;
  padding:5px 6px;font-family:"Spline Sans Mono",monospace;font-size:11.5px;text-align:right;color:var(--ink)}
.pt .num{white-space:nowrap;font-size:11.5px}
.pt .act{white-space:nowrap;min-width:88px;padding-right:12px;line-height:1.25}
.pt .act b{font-weight:600;font-size:11.5px}
.pt .shs{font-size:9.5px;color:var(--muted)}
.pt .dil{font-size:9.5px;color:var(--gold);margin-top:1px}
.mvs{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.mv{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--line);
  border-radius:11px;padding:7px 8px 7px 11px}
.mv .mvn{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--gold);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv input{width:88px;background:var(--surface);border:1px solid var(--line);border-radius:8px;

<body>

<div id="app"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sh"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose">Close</button></div>
  <div class="sb" id="sheetBody"></div>
</div>

<script>
"use strict";
/* ---------- config & state ---------- */
const BACKEND="https://script.google.com/macros/s/AKfycbyCNQActuQE9F8aNPZsISFMlWWJf2Mj1jRT2Em-jSC4ZCENFKdgrEvHWX46HxaxDd_kYw/exec";
let AUTH=null; try{AUTH=JSON.parse(localStorage.getItem("nivesh_auth")||"null");}catch(e){}
const api=q=>BACKEND+"?u="+encodeURIComponent(AUTH.u)+"&p="+encodeURIComponent(AUTH.p)+(q?"&"+q:"");
const ERRS={unauthorized:"Wrong username or PIN.",locked:"Too many attempts — try again in a few minutes.",
  username_taken:"That username is taken.",bad_username:"Username: 3–20 letters, digits, - or _.",
  pin_too_short:"PIN must be at least 4 characters."};
const errMsg=c=>ERRS[c]||("Error: "+c);
let stocks={}, txns={}, meta={}, ready=false, live=false, sheetOpen=false;
let sync="init", failCount=0, lastQuotes=null;   /* init | live | off */
const INDICES=[{s:"^NSEI",n:"NIFTY 50"},{s:"^BSESN",n:"SENSEX"}];
/* ESOPs are ICICI Bank shares, deliberately kept out of stocks{} - priced on their own */
const ESOP_SYM="ICICIBANK";
const esopOn=()=>!!(meta.esops&&(Object.keys(meta.esops.lots||{}).length||Object.keys(meta.esops.grants||{}).length));
const esopSyms=()=>esopOn()?[ESOP_SYM]:[];
let idx={};
let tab="core", flowPeriod="all", openMonth=null, sortBy="day", flowSel={};
let flowA=null, flowB=null;   /* custom range, "YYYY-MM" each */
let flowTouched=false;        /* false = the whole period is selected */
let targetDraft={}, buyDraft={}, planMode="add", planAmt="", planMoves={};
const POOL2="Satellite";
const BUILD="v43";   /* keep in step with CACHE in sw.js - shown in Account */
let saveTimer=null, pendingSave=false;

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const inr0=new Intl.NumberFormat("en-IN",{maximumFractionDigits:0});
const inr2=new Intl.NumberFormat("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const rupee=n=>"₹"+inr0.format(Math.round(Math.abs(n)));
const compactR=n=>{const a=Math.abs(n);return a>=1e7?"₹"+(a/1e7).toFixed(2)+"Cr":a>=1e5?"₹"+(a/1e5).toFixed(1)+"L":a>=1000?"₹"+Math.round(a/1000)+"k":"₹"+Math.round(a);};
const price=n=>"₹"+(Number.isInteger(n)?inr0.format(n):inr2.format(n));
const sgn=n=>n>0?"+":(n<0?"−":"");
const smoney=n=>sgn(n)+rupee(n);
const spct=n=>isFinite(n)?sgn(n)+Math.abs(n).toFixed(1)+"%":"—";
const cls=n=>n>0?"gain":(n<0?"loss":"");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID().replace(/-/g,"").slice(0,20);
const today=()=>new Date().toISOString().slice(0,10);
const monthName=m=>{const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleString("en-IN",{month:"short"})+" "+y;};
function ago(iso){
  const d=new Date(iso); if(isNaN(d)) return "";
  const s=Math.round((Date.now()-d)/1000);
  if(s<50) return s+"s ago";
  const m=Math.round(s/60);
  if(m<60) return m+"m ago";
  if(m<48*60) return Math.round(m/60)+"h ago";
  return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
}

/* ---------- theme ---------- */
function applyTheme(){
  let t=null; try{t=localStorage.getItem("nivesh_theme");}catch(e){}
  if(t==="light"||t==="dark") document.documentElement.dataset.theme=t;
  else delete document.documentElement.dataset.theme;
  const b=$("#themeBtn"); if(b){b.textContent=t==="light"?"☀":(t==="dark"?"☾":"◐");b.title=t?("Theme: "+t):"Theme: auto";}
}
function cycleTheme(){
  let t=null; try{t=localStorage.getItem("nivesh_theme");}catch(e){}
  const next=t==="light"?"dark":(t==="dark"?null:"light");
  try{ next?localStorage.setItem("nivesh_theme",next):localStorage.removeItem("nivesh_theme"); }catch(e){}
  applyTheme();
}

/* ---------- persistence ---------- */
function cacheLocal(){ try{localStorage.setItem("nivesh_cache_"+AUTH.u,JSON.stringify({stocks,txns,meta,idx}));}catch(e){} }
function saveRemote(force){
  if(!AUTH) return;
  cacheLocal();
  clearTimeout(saveTimer); pendingSave=true; renderHeroOnly();
  saveTimer=setTimeout(async()=>{
    try{
      const r=await fetch(api(""),{method:"POST",headers:{"Content-Type":"text/plain"},
        body:JSON.stringify({action:"save",force:force===true,
          data:{stocks,txns,...(meta.history?{history:meta.history}:{}),...(meta.esops?{esops:meta.esops}:{}),savedAt:new Date().toISOString()}})});
      const j=await r.json(); pendingSave=!j.saved;
      if(j.error==="suspicious_save"){
        const st=$("#status");
        if(st){ st.style.display="block";
          st.textContent="Save blocked: this would have replaced "+j.oldTx+" records with "+j.inTx+". Your server data is untouched — reload the app."; }
      }
    }catch(e){ pendingSave=true; }
    renderHeroOnly();
  },1200);
}
let lastLoadAt=0;
async function loadRemote(){
  if(!AUTH) return false;
  try{
    const syms=[...new Set(Object.values(stocks).map(s=>s.symbol).filter(Boolean).concat(esopSyms()))].concat(INDICES.map(i=>i.s));
    const r=await fetch(api("action=load&symbols="+syms.join(",")));
    const j=await r.json();
    if(j.error){ ready=true; live=false; sync="off"; return false; }
    if(j.data){ stocks=j.data.stocks||{}; txns=j.data.txns||{};
      if(j.data.history) meta.history=j.data.history;
      if(j.data.esops) meta.esops=j.data.esops; }
    if(j.quotes&&Object.keys(j.quotes).length){        /* relay bundled prices in - no 2nd trip */
      lastQuotes=j.quotes;
      for(const i of INDICES) if(j.quotes[i.s]) idx[i.s]=j.quotes[i.s];
      if(j.quotes[ESOP_SYM]) idx[ESOP_SYM]=j.quotes[ESOP_SYM];
      applyQuotes(j.quotes);
      meta.updatedAt=j.t||new Date().toISOString(); sync="live";
    }
    ready=true; live=true; failCount=0; lastLoadAt=Date.now();
    const needQuotes=Object.values(stocks).some(s=>s.symbol);
    if(!needQuotes) sync="live";          /* nothing to price - we are done */
    else if(sync==="off") sync="init";    /* connected again, prices still pending */
    cacheLocal(); return true;
  }catch(e){ ready=true; live=false; if(sync!=="live") sync="off"; return false; }
}

/* ---------- live quotes ---------- */
function applyQuotes(q){
  if(!q) return false;   /* index symbols start with ^ and are handled separately */
  let hit=false, oldest=0;
  for(const s of Object.values(stocks)){
    const v=q[s.symbol];
    if(!v||!(v.p>0)) continue;
    const sane = !s.price || (v.p < s.price*25 && v.p > s.price/25);
    if(sane){ s.price=v.p; s.prevClose=v.pc||v.p; hit=true;
      if(v.t && (!oldest || v.t<oldest)) oldest=v.t; }
  }
  /* badge should say how old the PRICES are, not when the reply landed:
     the relay may have served them from its cache */
  if(hit) meta.priceAt = oldest ? new Date(oldest).toISOString() : new Date().toISOString();
  return hit;
}
async function pollQuotes(){
  if(!AUTH||document.hidden) return;
  const syms=[...new Set(Object.values(stocks).map(s=>s.symbol).filter(Boolean).concat(esopSyms()))];
  const want=syms.concat(INDICES.map(i=>i.s));
  if(!want.length) return;
  try{
    const r=await fetch(api("action=quotes&symbols="+want.join(",")));
    const j=await r.json();
    if(j.quotes){
      lastQuotes=j.quotes;
      for(const i of INDICES) if(j.quotes[i.s]) idx[i.s]=j.quotes[i.s];
      if(j.quotes[ESOP_SYM]) idx[ESOP_SYM]=j.quotes[ESOP_SYM];
      applyQuotes(j.quotes);
      meta.updatedAt=j.t||new Date().toISOString();
      live=true; sync="live"; failCount=0; cacheLocal();
      safeRender();
      if(tab==="plan"&&!sheetOpen) refreshPlan();
    }
  }catch(e){
    /* one dropped request is normal on mobile - only surface it after two in a row */
    failCount++;
    if(failCount>=2){ live=false; if(sync==="live") sync="off"; }
    renderHeroOnly();
  }
}
setInterval(pollQuotes,15000);
setInterval(()=>{ if(!document.hidden&&AUTH&&ready) renderHeroOnly(); },5000);
setTimeout(()=>checkBuild(),20000); setInterval(()=>{ if(!document.hidden) checkBuild(); },600000);
document.addEventListener("visibilitychange",async()=>{
  if(document.hidden) return;
  /* re-sync after being backgrounded so a stale tab never overwrites newer data */
  if(AUTH&&!sheetOpen&&Date.now()-lastLoadAt>120000){ await loadRemote(); safeRender(); }
  pollQuotes();
  checkBuild();
});
/* An installed PWA that is only resumed never re-fetches index.html, so it can sit
   on an old build for days. Compare the served build with ours and reload. */
let newBuild=null, buildAt=0;
async function checkBuild(){
  if(newBuild||Date.now()-buildAt<60000) return;
  buildAt=Date.now();
  try{
    const t=await fetch("./sw.js?cb="+Date.now(),{cache:"no-store"}).then(r=>r.text());
    const m=t.match(/folio-(v\d+)/);
    if(!m||m[1]===BUILD) return;
    newBuild=m[1];
    /* reload at most once a session, so a stale CDN copy can never loop */
    let done=false; try{ done=sessionStorage.getItem("folio_upd")===newBuild; }catch(e){}
    if(!done&&!sheetOpen&&!/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||"")){
      try{ sessionStorage.setItem("folio_upd",newBuild); }catch(e){}
      location.reload(); return;
    }
    const st=$("#status");
    if(st){ st.style.display="block"; st.innerHTML='A newer version is ready. <button class="linky" id="upNow">Reload</button>';
      const b=$("#upNow"); if(b) b.addEventListener("click",()=>location.reload()); }
  }catch(e){}
}

/* ---------- FIFO computations ---------- */
function stockTxns(sid){
  return Object.entries(txns).filter(([,t])=>t.stockId===sid).map(([id,t])=>({id,...t}))
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.seq||0)-(b.seq||0));
}
function holding(sid){
  const lots=[];
  for(const t of stockTxns(sid)){
    if(t.noLot) continue; /* flow-only record: already reflected in imported lots */
    if(t.side==="buy") lots.push({q:t.qty,p:t.price});
    else{ let r=t.qty;
      while(r>0&&lots.length){ const l=lots[0],take=Math.min(l.q,r); l.q-=take; r-=take; if(l.q<=1e-9)lots.shift(); } }
  }
  let qty=0,inv=0; for(const l of lots){qty+=l.q;inv+=l.q*l.p;}
  const s=stocks[sid]||{}, cp=s.price||0, pc=s.prevClose||cp;
  const cur=qty*cp, pl=cur-inv, day=qty*(cp-pc);
  return {qty,inv,avg:qty>0?inv/qty:0,cur,pl,
    plPct:inv>0?pl/inv*100:0,day,dayPct:(qty>0&&pc>0)?(cp-pc)/pc*100:0,lots};
}
function totals(list){
  const t={inv:0,cur:0,day:0,prevVal:0,up:0,down:0};
  for(const x of list){ t.inv+=x.h.inv; t.cur+=x.h.cur; t.day+=x.h.day;
    t.prevVal+=x.h.qty*((x.s.prevClose)||x.s.price||0);
    if(x.h.qty>0){ if(x.h.day>0)t.up++; else if(x.h.day<0)t.down++; } }
  t.pl=t.cur-t.inv; t.plPct=t.inv>0?t.pl/t.inv*100:0;
  t.dayPct=t.prevVal>0?t.day/t.prevVal*100:0;
  return t;
}
const all=()=>Object.keys(stocks).filter(id=>!stocks[id].closed).map(id=>({id,s:stocks[id],h:holding(id)}))
  .sort((a,b)=>b.h.cur-a.h.cur||a.s.name.localeCompare(b.s.name));

/* Complete cash-flow history across all broker accounts (imported ledger) plus any
   trades recorded in the app after the ledger ends. Holdings come from stocks/txns;
   this drives Flows and lifetime return so neither double-counts the other. */
function cashFlows(){
  const led=(meta.history&&meta.history.ledger)||null;
  if(led){
    const end=meta.history.end||"";
    const out=led.map(l=>({date:l.d,name:l.n,sym:l.s,side:l.b?"buy":"sell",qty:l.q,amt:l.v,approx:!!l.a}));
    for(const t of Object.values(txns)){
      /* the cutoff exists to stop imported lots double-counting against the ledger;
         a trade you typed in carries keep:1 and must show whatever its date */
      if(!t.date||t.noLot||(t.date<=end&&!t.keep)) continue;
      const s=stocks[t.stockId]||{};
      out.push({date:t.date,name:s.name||"?",sym:s.symbol||"",side:t.side,qty:t.qty,amt:t.qty*t.price});
    }
    return out.filter(f=>f.amt>0);
  }
  return Object.values(txns).filter(t=>!t.noLot&&t.qty*t.price>0).map(t=>{
    const s=stocks[t.stockId]||{};
    return {date:t.date,name:s.name||"?",sym:s.symbol||"",side:t.side,qty:t.qty,amt:t.qty*t.price};
  });
}
function xirr(){
  const flows=[];
  for(const f of cashFlows()){
    if(!f.date) continue;
    flows.push({d:new Date(f.date+"T00:00:00"),v:f.side==="buy"?-f.amt:f.amt});
  }
  if(flows.length<2) return null;
  let cur=0;
  for(const id of Object.keys(stocks)) cur+=holding(id).qty*(stocks[id].price||0);
  if(!(cur>0)) return null;
  const now=new Date(today()+"T00:00:00");
  flows.push({d:now,v:cur});
  const first=flows.reduce((a,f)=>f.d<a?f.d:a,flows[0].d);
  const years=(now-first)/(365.25*864e5);
  if(years<0.25) return null;
  if(!flows.some(f=>f.v<0)||!flows.some(f=>f.v>0)) return null;
  const npv=r=>flows.reduce((s,f)=>s+f.v/Math.pow(1+r,(f.d-first)/(365.25*864e5)),0);
  let lo=-0.95,hi=5;
  if(npv(lo)<0||npv(hi)>0) return null;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(npv(m)>0) lo=m; else hi=m; }
  const r=(lo+hi)/2;
  if(!isFinite(r)) return null;
  return {rate:r*100,years,since:first};
}

/* ---------- ESOPs ----------
   Grants vest 30% / 30% / 40% on the grant year +1, +2, +3. Exercising turns a
   tranche into a share lot held in the demat account: cost basis is the market
   price on the exercise day, and the perquisite tax was already paid on the
   spread over the strike. Sold lots are simply deleted - this section tracks
   what is still held and what is still to vest. */
const VEST=[0.30,0.30,0.40];
const esopDefaults={taxPerq:34,taxCg:20};   /* editable; per-lot overrides win */
let esopOpen=null;                       /* the row whose calculator is showing */
let eD={};                               /* transient what-if inputs, keyed by row */
function esops(){
  const e=meta.esops||{};
  return {grants:e.grants||{},lots:e.lots||{},pool:e.pool||{},cmp:e.cmp,
    taxPerq:isFinite(e.taxPerq)?e.taxPerq:esopDefaults.taxPerq,
    taxCg:isFinite(e.taxCg)?e.taxCg:(isFinite(e.taxSt)?e.taxSt:esopDefaults.taxCg)};
}
function esopWrite(fn){
  if(!meta.esops) meta.esops={grants:{},lots:{},...esopDefaults};
  if(!meta.esops.grants) meta.esops.grants={};
  if(!meta.esops.lots) meta.esops.lots={};
  fn(meta.esops); saveRemote();
}
const esopLivePx=()=>{const q=idx[ESOP_SYM]; return q&&q.p>0?q.p:0;};
const esopPx=()=>{const E=esops(); return isFinite(+E.cmp)&&+E.cmp>0?+E.cmp:esopLivePx();};
/* the exercised shares as one pool - quantity, average exercise price, average grant price.
   Any of the three can be overridden from the dashboard; otherwise they come from the lots. */
function esopPool(){
  const E=esops(); let q=0,basis=0,gc=0;
  for(const l of Object.values(E.lots)){
    const g=E.grants[l.gid]||{}, n=+l.qty||0;
    q+=n; basis+=n*(+l.fmv||0); gc+=n*(+g.strike||0);
  }
  const p=E.pool||{};
  return {qty:isFinite(+p.qty)?+p.qty:q,
          fmv:isFinite(+p.fmv)?+p.fmv:(q?basis/q:0),
          gpx:isFinite(+p.gpx)?+p.gpx:(q?gc/q:0)};
}
function esopSummary(){
  const E=esops(), P=esopPool(), cmp=esopPx();
  const value=P.qty*cmp;
  const cgTax=Math.max(0,P.qty*(cmp-P.fmv))*E.taxCg/100;
  const grantCost=P.qty*P.gpx;
  const perqTax=Math.max(0,P.qty*(P.fmv-P.gpx))*E.taxPerq/100;
  return {...P,cmp,value,cgTax,net:value-cgTax,grantCost,perqTax,
          pat:value-cgTax-grantCost-perqTax};
}
/* vested tranches that have not been exercised, by the year they vested.
   Exercised lots and anything sold earlier are consumed oldest tranche first. */
function esopVestedOpen(){
  const E=esops(), y0=thisYear(), out=[];
  for(const [gid,g] of Object.entries(E.grants)){
    let used=Object.values(E.lots).filter(l=>l.gid===gid).reduce((a,l)=>a+(+l.qty||0),0)+(+g.sold||0);
    for(let i=0;i<VEST.length;i++){
      const vy=(+g.year)+i+1; if(vy>y0) break;
      const q=vestedBy(g,vy)-vestedBy(g,vy-1);
      const take=Math.min(used,q); used-=take;
      if(q-take>0) out.push({year:vy,gy:+g.year,gid,qty:q-take,gpx:+g.strike||0});
    }
  }
  return out.sort((a,b)=>a.year-b.year);
}
/* cumulative options vested by the end of a calendar year */
function vestedBy(g,year){
  const n=year-(+g.year); let f=0;
  for(let i=0;i<VEST.length;i++) if(n>=i+1) f+=VEST[i];
  return Math.round((+g.qty||0)*f);
}
const thisYear=()=>new Date().getFullYear();
/* one row per held lot, with the tax that a sale today would attract */
function esopLots(){
  const E=esops(), px=esopPx(), out=[];
  for(const [id,l] of Object.entries(E.lots)){
    const g=E.grants[l.gid]||{}, qty=+l.qty||0, fmv=+l.fmv||0, strike=+g.strike||0;
    const perq=isFinite(+l.perq)&&+l.perq>=0?+l.perq:Math.max(0,qty*(fmv-strike))*E.taxPerq/100;
    const cash=qty*strike+perq;                 /* what it actually cost you */
    const value=qty*px, gain=value-qty*fmv;
    const rate=isFinite(+l.cgr)&&+l.cgr>=0?+l.cgr:E.taxCg;
    const tax=gain>0?gain*rate/100:0;
    out.push({id,gid:l.gid,year:+g.year||0,qty,fmv,strike,date:l.date||"",
      perq,cash,value,gain,tax,net:value-tax,rate});
  }
  return out.sort((a,b)=>a.year-b.year||b.qty-a.qty);
}
/* what is still to vest, by calendar year */
/* vested, minus what is exercised and what was sold before the app existed */
function esopUnex(gid){
  const E=esops(), g=E.grants[gid]; if(!g) return 0;
  const held=Object.values(E.lots).filter(l=>l.gid===gid).reduce((a,l)=>a+(+l.qty||0),0);
  return Math.max(0,vestedBy(g,thisYear())-held-(+g.sold||0));
}
function esopVesting(){
  const E=esops(), y0=thisYear(), by={};
  for(const g of Object.values(E.grants)){
    for(let y=y0+1;y<=(+g.year)+VEST.length;y++){
      const q=vestedBy(g,y)-vestedBy(g,y-1);
      if(q>0){ (by[y]=by[y]||{q:0,rows:[]}); by[y].q+=q; by[y].rows.push({year:g.year,q}); }
    }
  }
  return by;
}
/* the what-if inputs behind a row: everything pre-filled, nothing to type unless you want to */
function eDraft(key,d){
  if(!eD[key]) eD[key]={};
  const o=eD[key];
  for(const k in d) if(o[k]===undefined||o[k]==="") o[k]=d[k];
  return o;
}
const eNum=(k,f,v,lab)=>'<label class="ei"><span>'+lab+'</span>'+
  '<input class="mono" data-ek="'+k+'" data-ef="'+f+'" inputmode="decimal" value="'+v+'"></label>';
const eLine=(l,v,c)=>'<div class="eres'+(c?" tot":"")+'"><span>'+l+'</span><b class="mono'+
  (c?" "+cls(c==="auto"?0:0):"")+'">'+v+'</b></div>';
/* a sale of shares already sitting in the demat */
/* options that still have to be exercised - vested now, or vesting later */
function calcOption(qty,strike,key,px,E){
  const d=eDraft(key,{ep:(px||0).toFixed(2),sq:qty,sp:(px||0).toFixed(2),tx:E.taxCg});
  const ep=+d.ep||0, sq=Math.min(Math.max(0,+d.sq||0),qty), sp=+d.sp||0, tx=+d.tx||0;
  const exCost=sq*strike, perq=Math.max(0,sq*(ep-strike))*E.taxPerq/100;
  const cgTax=Math.max(0,sq*(sp-ep))*tx/100, proceeds=sq*sp;
  const profit=proceeds-exCost-perq-cgTax;
  return {pat:profit,
    form:eNum(key,"ep",d.ep,"Exercise at")+eNum(key,"sq",d.sq,"Sell qty")+
               eNum(key,"sp",d.sp,"Sell price")+eNum(key,"tx",d.tx,"Tax %"),
    rows:eLine("Sale proceeds",rupee(proceeds))+
      eLine("Cost to exercise","−"+rupee(exCost))+
      eLine("Perquisite tax @"+E.taxPerq+"%","−"+rupee(perq))+
      eLine("Tax on gain","−"+rupee(cgTax))+
      '<div class="eres tot"><span>Profit after tax</span><b class="mono '+cls(profit)+'">'+sgn(profit)+rupee(profit)+'</b></div>'};
}

/* not-vested tranches, one row per grant per vesting year */
function esopNotVested(){
  const E=esops(), y0=thisYear(), out=[];

    for(let i=0;i<VEST.length;i++){

}

/* ---------- flows ---------- */
/* the Indian financial year runs 1 April to 31 March; offset 0 = current, 1 = previous */
function fyStart(off){
  const d=new Date();
  return (d.getMonth()>=3?d.getFullYear():d.getFullYear()-1)-(off||0);
}
const fyLabel=off=>{const y=fyStart(off);return "FY "+String(y%100).padStart(2,"0")+"-"+String((y+1)%100).padStart(2,"0");};
const monthEnd=ym=>{const[y,m]=ym.split("-").map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);};
/* every period resolves to an inclusive [from,to] window */
function flowWindow(){
  if(flowPeriod==="fy"||flowPeriod==="pfy"){
    const y=fyStart(flowPeriod==="pfy"?1:0);
    return [y+"-04-01",(y+1)+"-03-31"];
  }
  if(flowPeriod==="cus"){
    let a=flowA||fyStart(0)+"-04", b=flowB||new Date().toISOString().slice(0,7);
    if(a>b){ const t=a; a=b; b=t; }
    return [a+"-01",monthEnd(b)];
  }
  return ["0000-01-01","9999-12-31"];
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* year span offered by the custom pickers: from the oldest flow to this financial year */
function flowYears(){
  let lo=fyStart(0);
  for(const f of cashFlows()) if(f.date){ const y=+f.date.slice(0,4); if(y<lo) lo=y; }
  const hi=fyStart(0)+1, out=[];
  for(let y=hi;y>=lo;y--) out.push(y);
  return out;
}
function customHTML(){
  const a=flowA||fyStart(0)+"-04", b=flowB||new Date().toISOString().slice(0,7), ys=flowYears();
  const sel=(role,ym)=>{
    const[y,m]=ym.split("-");
    return '<select data-cus="'+role+'m" aria-label="Month">'+MON.map((n,i)=>
        '<option value="'+String(i+1).padStart(2,"0")+'"'+(+m===i+1?" selected":"")+'>'+n+'</option>').join("")+'</select>'+
      '<select data-cus="'+role+'y" aria-label="Year">'+ys.map(v=>
        '<option value="'+v+'"'+(+y===v?" selected":"")+'>'+v+'</option>').join("")+'</select>';
  };
  return '<div class="cus"><div class="cusr"><span>From</span>'+sel("a",a)+'</div>'+
         '<div class="cusr"><span>To</span>'+sel("b",b)+'</div></div>';
}
function flowsHTML(){
  const [from,to]=flowWindow(), byM={};
  for(const f of cashFlows()){
    if(!f.date||f.date<from||f.date>to) continue;
    const m=f.date.slice(0,7);
    (byM[m]=byM[m]||{net:0,rows:[]});
    byM[m].net+=(f.side==="sell"?1:-1)*f.amt;
    byM[m].rows.push(f);
  }
  const ms=Object.keys(byM).sort().reverse();
  for(const m of Object.keys(flowSel)) if(!byM[m]) delete flowSel[m];   /* drop months this period hides */
  if(!flowTouched){ flowSel={}; for(const m of ms) flowSel[m]=1; }      /* whole period until you untick */
  const chips='<div class="chips">'+[["fy",fyLabel(0)],["pfy",fyLabel(1)],["cus","Custom"],["all","All"]].map(p=>
    '<button aria-pressed="'+(flowPeriod===p[0])+'" data-period="'+p[0]+'">'+p[1].toUpperCase()+'</button>').join("")+"</div>"+
    (flowPeriod==="cus"?customHTML():"");
  if(!ms.length) return chips+'<div class="empty"><b>No activity</b>Nothing in this period.</div>';

  /* running total for whatever months are ticked */
  const sel=ms.filter(m=>flowSel[m]);
  let inn=0,out=0;
  for(const m of sel) for(const f of byM[m].rows){ if(f.side==="sell") out+=f.amt; else inn+=f.amt; }
  const net=out-inn;
  const tot='<div class="ftot"><div class="ft1"><span>'+
      (sel.length===ms.length?ms.length+' month'+(ms.length>1?"s":""):sel.length+' of '+ms.length+' months')+
      '</span><b class="mono '+(net>0?"gain":"")+'">'+smoney(net)+'</b></div>'+
    '<div class="ft2"><span class="mono">−'+rupee(inn)+'</span> bought · <span class="mono gain">+'+rupee(out)+'</span> sold'+
    (flowTouched?'<button class="linky" id="fClear">All months</button>':"")+'</div></div>';

  const max=Math.max(...ms.map(m=>Math.abs(byM[m].net)));
  return chips+tot+'<div class="flows">'+ms.map(m=>{
    const v=byM[m].net, w=max>0?Math.max(3,Math.abs(v)/max*100):0, open=openMonth===m, on=!!flowSel[m];
    return '<div class="mwrap'+(on?" on":"")+'">'+
      '<button class="msel" data-msel="'+m+'" aria-pressed="'+on+'" aria-label="Include '+monthName(m)+' in the total">'+(on?"✓":"")+'</button>'+
      '<button class="frow" data-month="'+m+'" aria-expanded="'+open+'"><div class="m">'+monthName(m)+'</div>'+
      '<div class="bar"><i class="'+(v>0?"ret":"in")+'" style="left:0;width:'+w+'%"></i></div>'+
      '<div class="a mono '+(v>0?"gain":"")+'">'+smoney(v)+'</div></button></div>'+
      (open?'<div class="mdet">'+byM[m].rows.sort((a,b)=>a.date<b.date?1:-1).map(t=>{
        const d=new Date(t.date+"T00:00:00");
        const dl=isNaN(d)?t.date:d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
        return '<div class="fr"><div class="fl">'+
          '<div class="fn"><span class="nw">'+esc(t.name)+(t.approx?' <span class="apx">≈</span>':"")+'</span>'+
            '<span class="tag '+(t.side==="buy"?"b":"s")+'">'+t.side.toUpperCase()+'</span></div>'+
          '<div class="fs mono">'+esc(dl)+' · '+t.qty+' × '+price(t.amt/t.qty)+'</div></div>'+
          '<div class="fa mono '+(t.side==="sell"?"gain":"")+'">'+(t.side==="sell"?"+":"−")+rupee(t.amt)+'</div></div>';
      }).join("")+"</div>":"");
  }).join("")+"</div>"+
  '<p class="hint" style="padding:0 4px">Money put into stocks shows as −, money back from sells as + in green. Tap a month for its transactions, untick one to leave it out of the total.</p>';
}

function bindPlan(){
  const pt=$("#planT");
  if(pt) pt.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    planMode=b.dataset.v; render();});
  const pc=$("#planCash");
  if(pc) pc.addEventListener("input",()=>{planAmt=pc.value; refreshPlan();});
  document.querySelectorAll("[data-sim]").forEach(th=>
    th.addEventListener("click",()=>{
      const id=th.dataset.sim;
      if(planMoves[id]!==undefined){ delete planMoves[id]; }
      else{
        const core=corePool(), c=planCtx(core), x=core.find(k=>k.id===id), t=x?planT(x):NaN;
        const seed=x&&isFinite(t)&&t>0&&t<100?Math.round(planMatch(x.h.inv,t,c.T2)):0;
        planMoves[id]=String(seed);
      }
      render();
    }));
  document.querySelectorAll("[data-mv-i]").forEach(inp=>
    inp.addEventListener("input",()=>{planMoves[inp.dataset.mvI]=inp.value; refreshPlan();}));
  document.querySelectorAll("[data-mv-x]").forEach(b=>
    b.addEventListener("click",()=>{delete planMoves[b.dataset.mvX]; render();}));
  document.querySelectorAll("[data-plan-t]").forEach(inp=>{
    const id=inp.closest("tr").dataset.id;
    inp.addEventListener("input",()=>{targetDraft[id]=inp.value; refreshPlan();});

      if(stocks[id]){ stocks[id].target=isFinite(v)?v:null; saveRemote(); }});
  });
  document.querySelectorAll("[data-plan-b]").forEach(inp=>{
    const id=inp.closest("tr").dataset.id;
    inp.addEventListener("input",()=>{buyDraft[id]=inp.value; refreshPlan();});

      if(stocks[id]){ stocks[id].buyBelow=isFinite(v)?v:null; saveRemote(); }});
  });

function refreshPlan(){
  const core=corePool(), c=planCtx(core), T2=c.T2;
  let sumT=0,sumDelta=0;
  document.querySelectorAll(".pt tbody tr").forEach(row=>{
    const id=row.dataset.id, x=core.find(k=>k.id===id); if(!x) return;
    const t=planT(x), bb=planB(x), mv=c.moves[id];
    const inv=x.h.inv+(mv||0);
    const now=T2>0?inv/T2*100:0;
    if(isFinite(t)&&t>0){ sumT+=t; sumDelta+=t/100*T2-inv; }
    row.querySelector('[data-role="cmp"]').textContent=priceShort(x.s.price||0);
    row.querySelector('[data-role="ub"]').innerHTML=buyChip(x.s.price,bb);
    row.querySelector('[data-role="now"]').innerHTML=allocChip(now,t);
    row.querySelector('[data-role="act"]').innerHTML=planRowAct(x,t,T2,inv);
  });
  document.querySelectorAll("[data-mv-sh]").forEach(el=>{
    const x=core.find(k=>k.id===el.dataset.mvSh); if(x) el.textContent=moveShares(x,c.moves[x.id]);
  });
  const sb=document.querySelector('[data-role="sub"]'); if(sb) sb.innerHTML=planSubHTML(c);
  const st=document.querySelector('[data-role="sumt"]'); if(st){st.textContent=sumT.toFixed(1)+"%"; st.style.color=sumT>100.01?"var(--loss)":"var(--ink)";}
  const ua=document.querySelector('[data-role="unalloc"]'); if(ua) ua.textContent=smoney(Math.abs(c.cash-sumDelta)<1?0:c.cash-sumDelta);
  const nh=document.querySelector('[data-role="nowh"]'); if(nh) nh.textContent=(c.cash||c.put)?"New":"Now";
}
function delStock(id,btn){
  if(btn.dataset.armed!=="1"){ btn.dataset.armed="1"; btn.textContent="Sure?"; setTimeout(()=>{btn.dataset.armed="";btn.textContent="Delete";},2500); return; }
  for(const tid of Object.keys(txns)) if(txns[tid].stockId===id) delete txns[tid];
  delete stocks[id]; saveRemote(); render();
}

/* stocks looked up in the last 7 days, kept per account on this device */
function recents(){
  try{
    const r=JSON.parse(localStorage.getItem("nivesh_recent_"+AUTH.u)||"[]");
    const cut=Date.now()-7*86400000;
    return r.filter(x=>x&&x.s&&x.t>cut).sort((a,b)=>b.t-a.t).slice(0,12);
  }catch(e){ return []; }
}
function rememberSearch(sym,name){
  try{
    const list=recents().filter(x=>x.s!==sym);
    list.unshift({s:sym,n:name,t:Date.now()});
    localStorage.setItem("nivesh_recent_"+AUTH.u,JSON.stringify(list.slice(0,12)));
  }catch(e){}
}
function forgetSearch(sym){
  try{ localStorage.setItem("nivesh_recent_"+AUTH.u,JSON.stringify(recents().filter(x=>x.s!==sym))); }catch(e){}
}
function forgetAllSearches(){
  try{ localStorage.removeItem("nivesh_recent_"+AUTH.u); }catch(e){}
}

let searchTimer=null, searchSeq=0, recTimer=null;
function searchSheet(){
  tapsBound=false; clearTimeout(recTimer);
  openSheet("Search stocks",
    '<div class="f"><label>Company or symbol</label>'+
    '<input id="qIn" placeholder="e.g. Tata Motors, INFY" autocomplete="off" autocapitalize="none"></div>'+
    '<div id="qOut">'+recentHTML()+'</div>');
  const inp=$("#qIn"); inp.focus();
  bindResultTaps(); priceRows("#qOut");
  inp.addEventListener("input",()=>{
    const q=inp.value.trim();
    clearTimeout(searchTimer);
    if(q.length<2){ clearTimeout(recTimer); $("#qOut").innerHTML=recentHTML(); bindResultTaps(); priceRows("#qOut"); return; }
    $("#qOut").innerHTML='<p class="hint">Searching…</p>';
    searchTimer=setTimeout(()=>runSearch(q),350);
  });
}
async function runSearch(q){
  const mine=++searchSeq;
  let list=[];
  try{
    const j=await fetch(api("action=search&q="+encodeURIComponent(q))).then(r=>r.json());
    if(mine!==searchSeq) return;
    list=j.results||[];
  }catch(e){
    if(mine===searchSeq) $("#qOut").innerHTML='<p class="hint">Couldn’t reach the market feed. Try again.</p>';
    return;
  }
  if(!list.length){ $("#qOut").innerHTML='<p class="hint">Nothing found for “'+esc(q)+'”.</p>'; return; }
  const held={}; for(const s of Object.values(stocks)) if(s.symbol) held[s.symbol]=1;
  $("#qOut").innerHTML=list.map(r=>rowHTML(r.s,r.n,held[r.s],"")).join("")+
    '<p class="hint">Tap a result to add it to your portfolio. Searches are kept under Recently searched for 7 days.</p>';
  bindResultTaps();
  priceRows("#qOut");
  /* a look-up counts as a search even if you never tap it: once the query has
     settled, file the best match under Recently searched */
  clearTimeout(recTimer);
  recTimer=setTimeout(()=>{
    if(mine===searchSeq && list[0]) rememberSearch(list[0].s, list[0].n);
  },1800);
}
let tapsBound=false;
function bindResultTaps(){
  if(tapsBound) return; tapsBound=true;
  $("#qOut").addEventListener("click",e=>{
    const x=e.target.closest("[data-rm]");
    if(x){ e.stopPropagation(); forgetSearch(x.dataset.rm); redrawRecents(); return; }
    if(e.target.closest("#qClear")){ forgetAllSearches(); redrawRecents(); return; }
    const row=e.target.closest("[data-sym]"); if(!row) return;
    rememberSearch(row.dataset.sym,row.dataset.name);
    closeSheet(); addSheet(row.dataset.name,row.dataset.sym);
  });
}

function parseDate(s){
  s=(s||"").trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/); if(m) return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  const d=new Date(s); if(s&&!isNaN(d)) return d.toISOString().slice(0,10);
  return null;
}
function parseImport(text){
  const out=[];
  for(const line of text.split(/\n+/)){
    if(!line.trim()) continue;
    const parts=line.split(/\t|,|;/).map(p=>p.trim()).filter(Boolean);
    if(parts.length<3) continue;
    let name="",date=null; const nums=[];
    for(const p of parts){
      const d=parseDate(p);
      const n=parseFloat(p.replace(/[₹,\s]/g,""));
      if(d&&p.match(/\d{4}|\d{1,2}[-\/]\d{1,2}/)) date=d;
      else if(isFinite(n)&&p.match(/^[₹\d.,\s]+$/)) nums.push(n);
      else if(!name) name=p;
    }
    if(!name||nums.length<2) continue;
    const qty=nums[0],pr=nums[1];
    if(qty>0&&pr>0) out.push({name,date:date||today(),qty,price:pr});
  }
  return out;
}

/* buy / sell */
function txnSheet(id,side){
  const s=stocks[id], h=holding(id);
  openSheet((side==="buy"?"Buy":"Sell")+" · "+s.name,
    '<div class="togg full'+(side==="sell"?" sell":"")+'" id="sideT">'+
      '<button aria-pressed="'+(side==="buy")+'" data-v="buy">Buy</button>'+
      '<button aria-pressed="'+(side==="sell")+'" data-v="sell">Sell</button></div>'+
    '<div class="f2"><div class="f"><label>Quantity</label><input id="tQty" class="mono" inputmode="numeric"></div>'+
    '<div class="f"><label>Price</label><input id="tPrice" class="mono" inputmode="decimal" value="'+(s.price||"")+'"></div></div>'+
    '<div class="f"><label>Date</label><input id="tDate" type="date" value="'+today()+'"></div>'+
    '<p class="hint">Holding <span class="mono">'+h.qty+'</span> · avg <span class="mono">'+price(h.avg)+'</span> · sells consume oldest lots first (FIFO)</p>'+
    '<div class="hint mono" id="fifoPrev"></div>'+
    '<div class="err" id="tErr"></div>'+
    '<button class="primary" id="tGo">Confirm</button>');
  let cur=side;
  const st=$("#sideT");
  const prev=()=>{
    if(cur!=="sell"){$("#fifoPrev").textContent="";return;}
    const q=parseFloat($("#tQty").value); if(!(q>0)){$("#fifoPrev").textContent="";return;}
    let r=q,cost=0; for(const l of h.lots){const take=Math.min(l.q,r);cost+=take*l.p;r-=take;if(r<=0)break;}
    if(r>0){$("#fifoPrev").textContent="";return;}
    const p=parseFloat($("#tPrice").value)||s.price||0;
    const g=q*p-cost;
    $("#fifoPrev").innerHTML="FIFO cost "+rupee(cost)+" → realized <span class='"+cls(g)+"'>"+smoney(g)+"</span>";
  };
  st.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=b.dataset.v;
    st.classList.toggle("sell",cur==="sell");
    st.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
    $("#sheetTitle").textContent=(cur==="buy"?"Buy":"Sell")+" · "+s.name; prev();});
  $("#tQty").addEventListener("input",prev); $("#tPrice").addEventListener("input",prev);
  $("#tGo").addEventListener("click",()=>{
    const qty=parseFloat($("#tQty").value), p=parseFloat($("#tPrice").value), date=$("#tDate").value||today();
    if(!(qty>0)||!(p>0)) return showErr("#tErr","Enter quantity and price.");
    if(cur==="sell"&&qty>holding(id).qty) return showErr("#tErr","You hold only "+holding(id).qty+".");
    txns[uid()]={stockId:id,side:cur,qty,price:p,date,seq:Date.now(),keep:1};
    saveRemote(); closeSheet();
  });
}

/* edit stock: symbol, pool, manual prices, history */
function histSheet(id){
  const s=stocks[id];
  const rows=stockTxns(id).reverse();
  openSheet("Edit · "+s.name,
    '<div class="togg full" id="ePool"><button aria-pressed="'+(s.pool!=="ipo")+'" data-v="core">Core</button>'+
      '<button aria-pressed="'+(s.pool==="ipo")+'" data-v="ipo">'+POOL2+'</button></div>'+
    '<p class="hint" style="margin-top:6px">'+POOL2+' holdings count in the dashboard but stay out of allocation and the rebalance plan.</p>'+
    '<div class="f"><label>Ticker (for live prices)</label><input id="eSym" class="mono" autocapitalize="characters" value="'+esc(s.symbol||"")+'" placeholder="e.g. HDFCBANK"></div>'+
    '<p class="hint" style="margin-top:6px">NSE tickers are plain. A stock listed only on BSE needs its <b>.BO</b> suffix — e.g. <span class="mono">SONALAD.BO</span>. Adding a stock fills this in for you.</p>'+
    '<div class="f2"><div class="f"><label>Price (manual)</label><input id="ePr" class="mono" inputmode="decimal" value="'+(s.price||"")+'"></div>'+
    '<div class="f"><label>Prev close</label><input id="ePc" class="mono" inputmode="decimal" value="'+(s.prevClose||"")+'"></div></div>'+
    '<button class="primary" id="eGo">Save</button>'+
    '<p class="hint">Manual prices matter only when there is no symbol — live quotes overwrite them.</p>'+
    '<div class="plhead" style="grid-template-columns:1fr"><span style="text-align:left">History</span></div>'+
    (rows.length?rows.map(t=>
      '<div class="trow"><div class="d8 mono">'+esc(t.date)+'</div>'+
      '<div class="side '+(t.side==="buy"?"gain":"loss")+'">'+t.side.toUpperCase()+'</div>'+
      '<div class="q mono" style="flex:1">'+t.qty+' × '+price(t.price)+' = '+rupee(t.qty*t.price)+'</div>'+
      '<button class="del" data-tid="'+t.id+'">Remove</button></div>').join("")
    :'<p class="hint">No transactions.</p>')+
    '<p class="hint">Remove a row to correct a mistake. ₹0 lots are bonus/split shares.</p>');
  let pool=s.pool==="ipo"?"ipo":"core";
  $("#ePool").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;pool=b.dataset.v;
    $("#ePool").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));});
  $("#eGo").addEventListener("click",()=>{
    s.pool=pool;
    s.symbol=$("#eSym").value.trim().toUpperCase()||null;
    const pr=parseFloat($("#ePr").value), pc=parseFloat($("#ePc").value);
    if(isFinite(pr)&&pr>0) s.price=pr;
    if(isFinite(pc)&&pc>0) s.prevClose=pc;
    saveRemote(); closeSheet(); pollQuotes();
  });
  $("#sheetBody").addEventListener("click",e=>{
    const b=e.target.closest(".del"); if(!b) return;
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Sure?"; return; }
    delete txns[b.dataset.tid]; saveRemote();
    b.closest(".trow").remove();
  });
}

/* settings */
function signOut(){
  try{localStorage.removeItem("nivesh_auth");}catch(e){}
  AUTH=null; stocks={}; txns={}; meta={}; ready=false;
  sheetOpen=false; $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
  mountSetup("in");
}
function snapLabel(key,keep){
  if(keep){
    const [y,m]=key.split("-");
    return {t:new Date(+y,+m-1,1).toLocaleString("en-IN",{month:"long"})+" "+y,s:"kept forever"};
  }
  const d=new Date(key+"T00:00:00");
  const days=Math.round((new Date(today()+"T00:00:00")-d)/86400000);
  const t=days===0?"Today":(days===1?"Yesterday":d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}));
  return {t,s:days<=1?"":days+" days ago"};
}
async function restoreSheet(){
  openSheet("Earlier versions","<p class='hint' style='margin-top:4px'>Loading…</p>");
  let list=[];
  try{ const j=await fetch(api("action=snapshots")).then(r=>r.json()); list=j.snapshots||[]; }
  catch(e){ $("#sheetBody").innerHTML="<p class='hint'>Couldn’t reach your data right now. Check your connection and try again.</p>"; return; }
  const rows=list.map(n=>({keep:n.indexOf("keep-")===0,key:n.replace(/^(snap|keep)-[0-9a-f]+-/,"").replace(".json","")}))
    .sort((a,b)=>a.key<b.key?1:-1);
  if(!rows.length){ $("#sheetBody").innerHTML="<p class='hint'>Nothing here yet. A version is saved automatically each day you make a change.</p>"; return; }
  $("#sheetBody").innerHTML=
    "<p class='hint' style='margin-top:4px'>Pick a date to bring your portfolio back to how it looked then. Your current version is saved first, so nothing is lost.</p>"+
    rows.map(r=>{const l=snapLabel(r.key,r.keep);
      return '<div class="trow"><div class="nm">'+esc(l.t)+
        (l.s?' <span style="font-weight:400;color:var(--faint);font-size:11px">· '+esc(l.s)+'</span>':"")+'</div>'+
        '<button class="del" data-key="'+esc(r.key)+'">Go back to this</button></div>';}).join("")+
    '<div class="err" id="rsErr"></div>'+
    '<p class="hint" style="text-align:center;margin-top:16px"><button class="linky" id="rsFile">Use a copy saved on my device instead</button></p>';
  $("#rsFile").addEventListener("click",importBackupSheet);
  $("#sheetBody").addEventListener("click",async e=>{
    const b=e.target.closest("[data-key]"); if(!b) return;
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again to confirm"; return; }
    b.textContent="Restoring…";
    try{
      const j=await fetch(api("action=snapshot&day="+encodeURIComponent(b.dataset.key))).then(r=>r.json());
      if(j.error||!j.data) return showErr("#rsErr","Couldn’t load that version. Try another date.");
      stocks=j.data.stocks||{}; txns=j.data.txns||{};
      saveRemote(true); closeSheet();
    }catch(e2){ showErr("#rsErr","Couldn’t reach your data right now."); }
  });
}
function importBackupSheet(){
  openSheet("Use a saved copy",
    '<p class="hint" style="margin-top:4px">Open the file you saved earlier, copy everything in it, and paste it below.</p>'+
    '<div class="f"><label>Paste the file’s contents</label><textarea id="rTxt"></textarea></div>'+
    '<div class="err" id="rErr"></div>'+
    '<button class="primary" id="rGo">Replace my portfolio with this</button>');
  $("#rGo").addEventListener("click",()=>{
    try{
      const d=JSON.parse($("#rTxt").value);
      if(!d.stocks||!d.txns) throw new Error("this doesn’t look like a Folio copy");
      stocks=d.stocks; txns=d.txns; saveRemote(true); closeSheet();
    }catch(e){ showErr("#rErr","Couldn’t read that — "+e.message+"."); }
  });
}
function cfgSheet(){
  openSheet("Account",
    '<p class="hint" style="margin-top:4px">Signed in as <b style="color:var(--ink)">'+esc(AUTH.u)+'</b>. Everything you change is saved automatically.</p>'+
    '<button class="primary" id="sOut">Sign out</button>'+
    '<div class="secthead">If something goes wrong</div>'+
    '<button class="ghost" id="sHist">Go back to an earlier version</button>'+
    '<p class="hint" style="margin-top:6px">Every day’s version is kept, plus one for every month — forever.</p>'+
    '<button class="ghost" id="sExp">Save a copy to this device</button>'+
    '<p class="hint" style="margin-top:6px">Optional. A file you can keep anywhere as your own backup.</p>'+
    '<div class="secthead">Danger</div>'+
    '<button class="ghost" id="sDel" style="color:var(--loss);border-color:var(--loss)">Delete my account and data</button>'+
    '<div class="err" id="sErr"></div>'+
    '<p class="hint" style="margin-top:16px;text-align:center">Build <span class="mono">'+BUILD+'</span></p>');
  $("#sOut").addEventListener("click",signOut);
  $("#sHist").addEventListener("click",restoreSheet);
  $("#sDel").addEventListener("click",async e=>{
    const b=e.currentTarget;
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Really delete everything?"; return; }
    try{
      const r=await fetch(api(""),{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"unregister"})});
      const j=await r.json();
      if(j.error) return showErr("#sErr",errMsg(j.error));
      try{localStorage.removeItem("nivesh_cache_"+AUTH.u);}catch(e2){}
      signOut();
    }catch(e2){ showErr("#sErr","Could not reach the server."); }
  });
  $("#sExp").addEventListener("click",e=>{
    const blob=new Blob([JSON.stringify({stocks,txns,exportedAt:new Date().toISOString()},null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="folio-"+today()+".json"; a.click(); URL.revokeObjectURL(a.href);
    e.currentTarget.textContent="Saved to your downloads";
    setTimeout(()=>{const b=$("#sExp"); if(b) b.textContent="Save a copy to this device";},2500);
  });
}

/* tabs */
function setTab(t){ tab=t;
  document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false"));
  render(); }

/* ---------- boot ---------- */
function mountShell(){
  $("#app").innerHTML=shellHTML();
  applyTheme();
  $("#themeBtn").addEventListener("click",cycleTheme);
  $("#cfgBtn").addEventListener("click",cfgSheet);
  $("#searchBtn").addEventListener("click",searchSheet);
  $("#fab").addEventListener("click",()=>tab==="esop"?esopGrantSheet():addSheet());
  $("#seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setTab(b.dataset.tab);});
}
function mountSetup(mode){
  mode=mode||"in";
  $("#app").innerHTML=setupHTML(mode);
  applyTheme();
  $("#authT").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.v!==mode)mountSetup(b.dataset.v);});
  $("#cGo").addEventListener("click",async()=>{
    const u=$("#cUser").value.trim().toLowerCase(), pin=$("#cPin").value;
    if(!u||!pin) return showErr("#cErr","Both fields are required.");
    if(mode==="new"&&pin!==$("#cPin2").value) return showErr("#cErr","PINs don't match.");
    $("#cGo").disabled=true;
    try{
      if(mode==="new"){
        const rr=await fetch(BACKEND+"?u="+encodeURIComponent(u)+"&p="+encodeURIComponent(pin),
          {method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"register"})});
        const jj=await rr.json();
        if(jj.error) throw new Error(errMsg(jj.error));
      }
      const r=await fetch(BACKEND+"?u="+encodeURIComponent(u)+"&p="+encodeURIComponent(pin)+"&action=load");
      const j=await r.json();
      if(j.error) throw new Error(errMsg(j.error));
      AUTH={u,p:pin}; try{localStorage.setItem("nivesh_auth",JSON.stringify(AUTH));}catch(e){}
      if(j.data){ stocks=j.data.stocks||{}; txns=j.data.txns||{}; } else { stocks={}; txns={}; }
      ready=true; live=true; cacheLocal();
      mountShell(); render(); pollQuotes();
    }catch(e){ $("#cGo").disabled=false; showErr("#cErr",e.message); }
  });
}
(async function boot(){
  if("serviceWorker" in navigator){ try{navigator.serviceWorker.register("sw.js");}catch(e){} }
  if(!AUTH){ mountSetup("in"); return; }
  try{ const c=JSON.parse(localStorage.getItem("nivesh_cache_"+AUTH.u)||"null");
    if(c){ stocks=c.stocks||{}; txns=c.txns||{}; meta=c.meta||{}; idx=c.idx||{}; ready=true; } }catch(e){}
  mountShell(); render();
  /* both relay calls go out at once - the second used to wait on the first,
     which doubled the cold-start wait before correct prices appeared */
  const dataP=loadRemote(), quoteP=pollQuotes();
  await dataP;
  if(lastQuotes) applyQuotes(lastQuotes);   /* fresh server data must not clobber newer prices */
  render();
  await quoteP;
  if(lastQuotes) applyQuotes(lastQuotes);
  render();
})();
</script>
